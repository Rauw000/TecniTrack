
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Fragmentos TecniTrack</title>
    </head>

    <body>

        <!-- Encabezado reutilizable del administrador -->
        <nav th:fragment="headerAdmin"
             class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">

            <div class="container-fluid px-4 px-lg-5">

                <!-- Logo -->
                <a class="navbar-brand fw-bold"
                   th:href="@{/inicio}">
                    TecniTrack
                </a>

                <!-- Menú para pantallas pequeñas -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuAdmin"
                        aria-controls="menuAdmin"
                        aria-expanded="false"
                        aria-label="Mostrar menú">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse"
                     id="menuAdmin">

                    <!-- Navegación administrativa -->
                    <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/inicio}">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/admin/ordenes/resumen}">
                                Órdenes
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/admin/recepciones}">
                                Recepciones
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/admin/servicios}">
                                Servicios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/admin/usuarios}">
                                Usuarios
                            </a>
                        </li>

                        <li class="nav-item ms-lg-3">

                            <form th:action="@{/logout}"
                                  method="post">
                                
                                <button type="submit"
                                        class="btn btn-outline-secondary btn-sm px-3">
                                    Cerrar sesión
                                </button>
                            </form>

                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </body>
</html>
