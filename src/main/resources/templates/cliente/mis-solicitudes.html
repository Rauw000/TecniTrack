
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Mis solicitudes - TecniTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/inicio}">
            TecniTrack
        </a>

        <a class="btn btn-outline-light btn-sm"
           th:href="@{/inicio}">
            Volver al inicio
        </a>

    </div>
</nav>

<main class="container py-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">

        <div>
            <h2>Mis solicitudes</h2>
            <p class="text-muted">
                Consultá el estado de tus reparaciones.
            </p>
        </div>

        <a th:href="@{/cliente/solicitudes/nueva}"
           class="btn btn-primary">
            + Nueva solicitud
        </a>

    </div>

    <!-- Mensaje cuando no hay solicitudes -->
    <div th:if="${#lists.isEmpty(solicitudes)}"
         class="alert alert-info">

        Todavía no tenés solicitudes registradas.

        <a th:href="@{/cliente/solicitudes/nueva}"
           class="alert-link">
            Registrar mi primera solicitud
        </a>

    </div>

    <!-- Tabla de solicitudes -->
    <div th:unless="${#lists.isEmpty(solicitudes)}"
         class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                        <tr>
                            <th>Número de orden</th>
                            <th>Equipo</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="orden : ${solicitudes}">

                            <td th:text="${orden.numeroOrden}">
                                TEC-000001
                            </td>

                            <td>
                                <strong th:text="${orden.equipo.tipo}">
                                    Laptop
                                </strong>

                                <div class="text-muted small"
                                     th:text="${orden.equipo.marca + ' ' + orden.equipo.modelo}">
                                    Lenovo IdeaPad
                                </div>
                            </td>

                            <td th:text="${#temporals.format(orden.fechaSolicitud, 'dd/MM/yyyy HH:mm')}">
                                08/11/2026
                            </td>

                            <td>
                                <span class="badge bg-warning text-dark"
                                      th:text="${orden.estadoActual}">
                                    Por recibir
                                </span>
                            </td>

                            <td>
                                <a class="btn btn-outline-primary btn-sm"
                                   th:href="@{/cliente/solicitudes/detalle/{id}(id=${orden.idOrden})}">
                                    Ver detalles
                                </a>
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</main>

</body>
</html>
