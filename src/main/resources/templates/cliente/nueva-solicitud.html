
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">

        <title>Nueva solicitud - TecniTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/inicio}">
                    TecniTrack
                </a>
                <a class="btn btn-outline-light btn-sm"
                   th:href="@{/inicio}">
                    Volver al inicio
                </a>
            </div>
        </nav>

        <main class="container py-5">

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">

                    <div class="card shadow-sm">
                        <div class="card-body p-4">

                            <h3 class="mb-2">Nueva solicitud de reparación</h3>

                            <p class="text-muted mb-4">
                                Completá los datos del equipo y describí
                                el problema que presenta.
                            </p>

                            <div th:if="${error}"
                                 class="alert alert-danger"
                                 role="alert"
                                 th:text="${error}">
                            </div>

                            <form th:action="@{/cliente/solicitudes/guardar}"
                                  method="post">

                                <h5 class="mb-3">Datos del equipo</h5>

                                <div class="mb-3">
                                    <label for="tipo" class="form-label">
                                        Tipo de equipo *
                                    </label>

                                    <select id="tipo"
                                            name="tipo"
                                            class="form-select"
                                            required>
                                        <option value="">Seleccione una opción</option>

                                        <option value="Laptop"
                                                th:selected="${tipo == 'Laptop'}">
                                            Laptop
                                        </option>

                                        <option value="Computadora de escritorio"
                                                th:selected="${tipo == 'Computadora de escritorio'}">
                                            Computadora de escritorio
                                        </option>

                                        <option value="Tablet"
                                                th:selected="${tipo == 'Tablet'}">
                                            Tablet
                                        </option>

                                        <option value="Otro"
                                                th:selected="${tipo == 'Otro'}">
                                            Otro
                                        </option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="marca" class="form-label">
                                        Marca *
                                    </label>

                                    <input type="text"
                                           id="marca"
                                           name="marca"
                                           class="form-control"
                                           maxlength="100"
                                           th:value="${marca}"
                                           placeholder="Ejemplo: Lenovo"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label for="modelo" class="form-label">
                                        Modelo *
                                    </label>

                                    <input type="text"
                                           id="modelo"
                                           name="modelo"
                                           class="form-control"
                                           maxlength="100"
                                           th:value="${modelo}"
                                           placeholder="Ejemplo: IdeaPad 3"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label for="numeroSerie" class="form-label">
                                        Número de serie (opcional)
                                    </label>

                                    <input type="text"
                                           id="numeroSerie"
                                           name="numeroSerie"
                                           class="form-control"
                                           maxlength="100"
                                           th:value="${numeroSerie}"
                                           placeholder="Número de serie del equipo">
                                </div>

                                <hr class="my-4">

                                <h5 class="mb-3">Descripción del problema</h5>

                                <div class="mb-4">
                                    <label for="fallaReportada"
                                           class="form-label">
                                        Falla reportada *
                                    </label>

                                    <textarea id="fallaReportada"
                                              name="fallaReportada"
                                              class="form-control"
                                              rows="5"
                                              maxlength="2000"
                                              placeholder="Describí qué problema presenta el equipo..."
                                              required
                                              th:text="${fallaReportada}"></textarea>
                                </div>

                                <div class="alert alert-info">
                                    <strong>Importante:</strong>
                                    Después de registrar la solicitud,
                                    deberás llevar el equipo al taller
                                    para su recepción.
                                </div>

                                <div class="d-flex gap-2">
                                    <button type="submit"
                                            class="btn btn-primary">
                                        Registrar solicitud
                                    </button>

                                    <a th:href="@{/inicio}"
                                       class="btn btn-secondary">
                                        Cancelar
                                    </a>
                                </div>

                            </form>
                        </div>
                    </div>

                </div>
            </div>

        </main>

    </body>
</html>
