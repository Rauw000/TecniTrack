
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">

        <title>Mis solicitudes - TecniTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" th:href="@{/inicio}">
                    TecniTrack
                </a>
            </div>
        </nav>

        <main class="container py-5">

            <div class="d-flex justify-content-between
                 align-items-center mb-4">

                <h2>Mis solicitudes</h2>

                <a th:href="@{/cliente/solicitudes/nueva}"
                   class="btn btn-primary">
                    + Nueva solicitud
                </a>
            </div>

            <div th:if="${mensaje}"
                 class="alert alert-success"
                 th:text="${mensaje}">
            </div>

            <div class="card shadow-sm">

                <div class="card-body">

                    <div th:if="${#lists.isEmpty(solicitudes)}"
                         class="alert alert-info mb-0">
                        Todavía no has registrado solicitudes.
                    </div>

                    <div th:unless="${#lists.isEmpty(solicitudes)}"
                         class="table-responsive">

                        <table class="table table-striped
                               table-hover align-middle">

                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Asunto</th>
                                    <th>Descripción</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="solicitud : ${solicitudes}">

                                    <td th:text="${solicitud.idSolicitud}">
                                    </td>

                                    <td th:text="${solicitud.asunto}">
                                    </td>

                                    <td th:text="${solicitud.descripcion}">
                                    </td>

                                    <td th:text="${#temporals.format(
                                        solicitud.fechaCreacion,
                                        'dd/MM/yyyy HH:mm')}">
                                    </td>

                                    <td>
                                        <span class="badge bg-warning text-dark"
                                              th:if="${solicitud.estado == 'PENDIENTE'}">
                                            Pendiente
                                        </span>

                                        <span class="badge bg-primary"
                                              th:if="${solicitud.estado == 'EN_PROCESO'}">
                                            En proceso
                                        </span>

                                        <span class="badge bg-success"
                                              th:if="${solicitud.estado == 'FINALIZADA'}">
                                            Finalizada
                                        </span>

                                        <span class="badge bg-secondary"
                                              th:unless="${solicitud.estado == 'PENDIENTE'
                                              or solicitud.estado == 'EN_PROCESO'
                                              or solicitud.estado == 'FINALIZADA'}"
                                              th:text="${solicitud.estado}">
                                        </span>
                                    </td>

                                </tr>
                            </tbody>
                        </table>

                    </div>
                </div>
            </div>

            <div class="mt-4">
                <a th:href="@{/inicio}"
                   class="btn btn-outline-secondary">
                    Volver al inicio
                </a>
            </div>

        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
