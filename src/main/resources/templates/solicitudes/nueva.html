
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">

        <title>Nueva solicitud - TecniTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" th:href="@{/inicio}">
                    TecniTrack
                </a>
            </div>
        </nav>

        <main class="container py-5">

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-7">

                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">
                                Registrar nueva solicitud
                            </h4>
                        </div>

                        <div class="card-body p-4">

                            <div th:if="${error}"
                                 class="alert alert-danger"
                                 th:text="${error}">
                            </div>

                            <form th:action="@{/cliente/solicitudes/guardar}"
                                  method="post">

                                <div class="mb-3">
                                    <label for="asunto"
                                           class="form-label">
                                        Asunto
                                    </label>

                                    <input type="text"
                                           id="asunto"
                                           name="asunto"
                                           class="form-control"
                                           maxlength="150"
                                           required
                                           th:value="${asuntoAnterior}"
                                           placeholder="Ej: Computadora no enciende">
                                </div>

                                <div class="mb-3">
                                    <label for="descripcion"
                                           class="form-label">
                                        Descripción del problema
                                    </label>

                                    <textarea id="descripcion"
                                              name="descripcion"
                                              class="form-control"
                                              rows="5"
                                              maxlength="1000"
                                              required
                                              placeholder="Describe el problema técnico..."
                                              th:text="${descripcionAnterior}"></textarea>
                                </div>

                                <div class="d-flex justify-content-between">

                                    <a th:href="@{/cliente/solicitudes}"
                                       class="btn btn-secondary">
                                        Cancelar
                                    </a>

                                    <button type="submit"
                                            class="btn btn-primary">
                                        Registrar solicitud
                                    </button>

                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
