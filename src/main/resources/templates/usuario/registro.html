<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">

        <title>Registro - TecniTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <div class="container mt-5">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="card shadow">

                        <div class="card-header bg-primary text-white text-center">

                            <h3>Crear cuenta - TecniTrack</h3>

                        </div>

                        <div class="card-body">

                            <div th:if="${param.exito}"
                                 class="alert alert-success">
                                ¡Cuenta creada correctamente!
                            </div>

                            <div th:if="${error}"
                                 class="alert alert-danger"
                                 th:text="${error}">
                            </div>

                            <form th:action="@{/registro}"
                                  th:object="${usuario}"
                                  method="post">

                                <div class="mb-3">

                                    <label class="form-label">Nombre completo</label>

                                    <input type="text"
                                           th:field="*{nombre}"
                                           class="form-control"
                                           required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">Correo electrónico</label>

                                    <input type="email"
                                           th:field="*{correo}"
                                           class="form-control"
                                           required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">Teléfono</label>

                                    <input type="tel"
                                           th:field="*{telefono}"
                                           class="form-control"
                                           required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">Contraseña</label>

                                    <input type="password"
                                           th:field="*{contrasenaHash}"
                                           class="form-control"
                                           minlength="8"
                                           required>

                                </div>

                                <div class="mb-3">

                                    <label class="form-label">Confirmar contraseña</label>

                                    <input type="password"
                                           name="confirmarContrasena"
                                           class="form-control"
                                           minlength="8"
                                           required>

                                </div>

                                <button type="submit"
                                        class="btn btn-primary w-100">

                                    Crear cuenta

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </body>
</html>
