<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Mi perfil - TecniTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <div class="container mt-5">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="card shadow">

                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">Actualizar datos de contacto</h4>
                        </div>

                        <div class="card-body">

                            <!-- Mensaje de éxito -->
                            <div th:if="${param.exito}"
                                 class="alert alert-success">
                                Datos actualizados correctamente.
                            </div>

                            <!-- Mensaje de error -->
                            <div th:if="${error}"
                                 class="alert alert-danger"
                                 th:text="${error}">
                            </div>

                            <!-- Formulario de actualización -->
                            <form th:action="@{/usuario/perfil}"
                                  th:object="${usuario}"
                                  method="post">

                                <div class="mb-3">
                                    <label class="form-label">Nombre completo</label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Correo electrónico</label>

                                    <input type="email"
                                           class="form-control"
                                           th:field="*{correo}"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Teléfono</label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{telefono}"
                                           required>
                                </div>

                                <div class="d-grid gap-2">

                                    <button type="submit"
                                            class="btn btn-primary">
                                        Guardar cambios
                                    </button>

                                    <a th:href="@{/inicio}"
                                       class="btn btn-secondary">
                                        Volver al inicio
                                    </a>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </body>
</html>
