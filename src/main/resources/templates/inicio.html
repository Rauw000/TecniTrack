
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">

        <title>Inicio - TecniTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <div class="container mt-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">
                        Bienvenido a TecniTrack
                    </h3>
                </div>

                <div class="card-body p-4">

                    <h5>¡Inicio de sesión exitoso!</h5>

                    <p>
                        Usuario conectado:
                        <strong th:text="${correo}"></strong>
                    </p>

                    <p>
                        Has ingresado correctamente al sistema.
                    </p>

                    <!-- Funcionalidades exclusivas del Cliente -->
                    <div sec:authorize="hasRole('Cliente')"
                         class="mt-4 mb-4">

                        <h5 class="mb-3">
                            Gestión de solicitudes
                        </h5>

                        <div class="d-flex flex-wrap gap-3">

                            <!-- HU05 -->
                            <a th:href="@{/cliente/solicitudes/nueva}"
                               class="btn btn-primary">

                                + Registrar solicitud

                            </a>

                            <!-- HU06 -->
                            <a th:href="@{/cliente/solicitudes}"
                               class="btn btn-success">

                                Mis solicitudes

                            </a>

                        </div>

                    </div>

                    <hr>

                    <!-- Cerrar sesión -->
                    <form th:action="@{/logout}"
                          method="post">

                        <button type="submit"
                                class="btn btn-danger">

                            Cerrar sesión

                        </button>

                    </form>

                </div>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
