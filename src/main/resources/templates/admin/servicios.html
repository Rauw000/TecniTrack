
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>Gestión de servicios | TecniTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/inicio}">
                    TecniTrack
                </a>
                <span class="navbar-text text-white">
                    Administración de servicios
                </span>
            </div>
        </nav>

        <main class="container py-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">Gestión de servicios</h2>
                <a th:href="@{/inicio}" class="btn btn-outline-secondary">
                    Volver al inicio
                </a>
            </div>

            <!-- Mensajes -->
            <div th:if="${mensaje}" class="alert alert-success"
                 th:text="${mensaje}"></div>

            <div th:if="${error}" class="alert alert-danger"
                 th:text="${error}"></div>

            <!-- Formulario de creación -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    Registrar nuevo servicio
                </div>

                <div class="card-body">
                    <form th:action="@{/admin/servicios/crear}"
                          method="post">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre del servicio
                            </label>
                            <input type="text"
                                   id="nombre"
                                   name="nombre"
                                   class="form-control"
                                   maxlength="100"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">
                                Descripción
                            </label>
                            <textarea id="descripcion"
                                      name="descripcion"
                                      class="form-control"
                                      rows="3"
                                      maxlength="500"
                                      required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success">
                            Guardar servicio
                        </button>
                    </form>
                </div>
            </div>

            <!-- Tabla de servicios -->
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    Servicios registrados
                </div>

                <div class="card-body">

                    <div th:if="${#lists.isEmpty(servicios)}"
                         class="alert alert-info">
                        Todavía no hay servicios registrados.
                    </div>

                    <div class="table-responsive"
                         th:unless="${#lists.isEmpty(servicios)}">

                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="servicio : ${servicios}">
                                    <td th:text="${servicio.idServicio}"></td>
                                    <td th:text="${servicio.nombre}"></td>
                                    <td th:text="${servicio.descripcion}"></td>

                                    <td>
                                        <span th:if="${servicio.activo}"
                                              class="badge bg-success">
                                            Activo
                                        </span>
                                        <span th:unless="${servicio.activo}"
                                              class="badge bg-secondary">
                                            Inactivo
                                        </span>
                                    </td>

                                    <td>
                                        <div class="d-flex gap-2 flex-wrap">

                                            <!-- Editar -->
                                            <button type="button"
                                                    class="btn btn-warning btn-sm"
                                                    data-bs-toggle="modal"
                                                    th:attr="data-bs-target=${'#editarServicio' + servicio.idServicio}">
                                                Editar
                                            </button>

                                            <!-- Cambiar estado -->
                                            <form th:action="@{/admin/servicios/cambiar-estado/{id}(id=${servicio.idServicio})}"
                                                  method="post">

                                                <input type="hidden"
                                                       name="activo"
                                                       th:value="${!servicio.activo}">

                                                <button type="submit"
                                                        class="btn btn-sm"
                                                        th:classappend="${servicio.activo} ? 'btn-danger' : 'btn-success'"
                                                        th:text="${servicio.activo} ? 'Desactivar' : 'Activar'">
                                                </button>
                                            </form>

                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Modales para editar servicios -->
            <div th:each="servicio : ${servicios}"
                 class="modal fade"
                 th:id="${'editarServicio' + servicio.idServicio}"
                 tabindex="-1">

                <div class="modal-dialog">
                    <div class="modal-content">

                        <form th:action="@{/admin/servicios/editar/{id}(id=${servicio.idServicio})}"
                              method="post">

                            <div class="modal-header">
                                <h5 class="modal-title">Editar servicio</h5>
                                <button type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">

                                <div class="mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text"
                                           name="nombre"
                                           class="form-control"
                                           th:value="${servicio.nombre}"
                                           maxlength="100"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Descripción</label>
                                    <textarea name="descripcion"
                                              class="form-control"
                                              rows="3"
                                              maxlength="500"
                                              required
                                              th:text="${servicio.descripcion}"></textarea>
                                </div>

                            </div>

                            <div class="modal-footer">
                                <button type="button"
                                        class="btn btn-secondary"
                                        data-bs-dismiss="modal">
                                    Cancelar
                                </button>

                                <button type="submit" class="btn btn-primary">
                                    Guardar cambios
                                </button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
