<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Resumen de órdenes - TecniTrack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold"
               th:href="@{/inicio}">
                TecniTrack
            </a>

            <a class="btn btn-outline-light"
               th:href="@{/inicio}">
                Volver al inicio
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <div class="mb-4">
            <h2 class="fw-bold">
                Resumen de órdenes
            </h2>

            <p class="text-muted">
                Consultá las órdenes abiertas según su estado.
            </p>
        </div>

        <!-- Tarjetas con conteos -->
        <div class="row g-3 mb-5">

            <div class="col-md-6 col-lg-3"
                 th:each="entrada : ${conteos}">

                <a class="text-decoration-none"
                   th:href="@{/admin/ordenes/resumen(estado=${entrada.key})}">

                    <div class="card h-100 border-0 shadow-sm">

                        <div class="card-body text-center">

                            <h6 class="text-muted"
                                th:text="${entrada.key}">
                                Estado
                            </h6>

                            <h2 class="fw-bold text-primary"
                                th:text="${entrada.value}">
                                0
                            </h2>

                            <span class="text-primary small">
                                Ver órdenes
                            </span>

                        </div>

                    </div>

                </a>

            </div>

        </div>

        <!-- Resultado del filtro -->
        <div th:if="${estadoSeleccionado != null}">

            <div class="d-flex justify-content-between
                        align-items-center mb-3">

                <h4 class="fw-bold mb-0">
                    Órdenes:
                    <span th:text="${estadoSeleccionado}">
                    </span>
                </h4>

                <a class="btn btn-outline-secondary btn-sm"
                   th:href="@{/admin/ordenes/resumen}">
                    Limpiar filtro
                </a>

            </div>

            <!-- Sin resultados -->
            <div th:if="${#lists.isEmpty(ordenes)}"
                 class="alert alert-info">

                No hay órdenes registradas en este estado.

            </div>

            <!-- Tabla de órdenes filtradas -->
            <div th:unless="${#lists.isEmpty(ordenes)}"
                 class="card border-0 shadow-sm">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">
                                <tr>
                                    <th>N.º de orden</th>
                                    <th>Fecha de solicitud</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="orden : ${ordenes}">

                                    <td class="fw-semibold"
                                        th:text="${orden.numeroOrden}">
                                    </td>

                                    <td th:text="${#temporals.format(orden.fechaSolicitud, 'dd/MM/yyyy HH:mm')}">
                                    </td>

                                    <td>
                                        <span class="badge bg-primary"
                                              th:text="${orden.estadoActual}">
                                        </span>
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
