<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">

        <title>Recepción de equipos - TecniTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <header th:replace="~{general/fragmentos :: headerAdmin}"></header>

        <main class="container py-5">

            <div class="mb-4">
                <h2 class="fw-bold">
                    Recepción de equipos
                </h2>
                <p class="text-muted">
                    Órdenes pendientes de recepción física.
                </p>
            </div>

            <!-- Mensajes -->
            <div th:if="${exito}"
                 class="alert alert-success"
                 th:text="${exito}">
            </div>

            <div th:if="${error}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <!-- Sin órdenes pendientes -->
            <div th:if="${#lists.isEmpty(ordenes)}"
                 class="alert alert-info">
                No hay equipos pendientes de recepción.
            </div>

            <!-- Tabla de órdenes -->
            <div th:unless="${#lists.isEmpty(ordenes)}"
                 class="card shadow-sm border-0">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead class="table-light">
                                <tr>
                                    <th>N.º de orden</th>
                                    <th>Fecha de solicitud</th>
                                    <th>Estado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="orden : ${ordenes}">

                                    <td class="fw-semibold"
                                        th:text="${orden.numeroOrden}">
                                    </td>

                                    <td th:text="${#temporals.format(orden.fechaSolicitud, 'dd/MM/yyyy HH:mm')}">
                                    </td>

                                    <td>
                                        <span class="badge bg-warning text-dark"
                                              th:text="${orden.estadoActual}">
                                        </span>
                                    </td>

                                    <td>
                                        <a class="btn btn-primary btn-sm"
                                           th:href="@{/admin/recepciones/{id}(id=${orden.idOrden})}">
                                            Recibir equipo
                                        </a>
                                    </td>

                                </tr>
                            </tbody>

                        </table>

                    </div>
                </div>
            </div>

        </main>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
