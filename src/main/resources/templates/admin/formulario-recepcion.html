<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">

        <title>Registrar recepción - TecniTrack</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>

    <body class="bg-light">

        <header th:replace="~{general/fragmentos :: headerAdmin}"></header>

        <main class="container py-5">

            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body p-4">

                            <h2 class="fw-bold mb-3">
                                Registrar recepción del equipo
                            </h2>

                            <p class="text-muted">
                                Completá los datos de recepción física.
                            </p>

                            <div class="alert alert-info">
                                <strong>Número de orden:</strong>
                                <span th:text="${orden.numeroOrden}"></span>
                            </div>

                            <div class="mb-4">
                                <strong>Estado actual:</strong>
                                <span class="badge bg-warning text-dark"
                                      th:text="${orden.estadoActual}">
                                </span>
                            </div>

                            <form th:action="@{/admin/recepciones/{id}/guardar(id=${orden.idOrden})}"
                                  method="post">

                                <div class="mb-3">
                                    <label for="condicionRecepcion"
                                           class="form-label fw-semibold">
                                        Condición física del equipo
                                    </label>

                                    <textarea id="condicionRecepcion"
                                              name="condicionRecepcion"
                                              class="form-control"
                                              rows="4"
                                              maxlength="2000"
                                              required
                                              placeholder="Ejemplo: Equipo con rayones leves, pantalla intacta y carcasa en buen estado."></textarea>

                                    <div class="form-text">
                                        Describí el estado en que se recibe el equipo.
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="accesorios"
                                           class="form-label fw-semibold">
                                        Accesorios recibidos
                                    </label>

                                    <textarea id="accesorios"
                                              name="accesorios"
                                              class="form-control"
                                              rows="3"
                                              maxlength="1000"
                                              required
                                              placeholder="Ejemplo: Cargador original y estuche. Si no hay accesorios, escribí: Sin accesorios."></textarea>

                                    <div class="form-text">
                                        Si el cliente no entrega accesorios,
                                        escribí "Sin accesorios".
                                    </div>
                                </div>

                                <div class="d-flex gap-2 justify-content-end">

                                    <a class="btn btn-outline-secondary"
                                       th:href="@{/admin/recepciones}">
                                        Cancelar
                                    </a>

                                    <button type="submit"
                                            class="btn btn-primary">
                                        Confirmar recepción
                                    </button>

                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
